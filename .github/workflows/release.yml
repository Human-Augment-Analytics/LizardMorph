name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. v1.0.1)'
        required: true
      platform:
        description: 'Build all installers or rebuild one platform without changing the release'
        type: choice
        options:
          - all
          - mac-intel
          - linux
        default: all

# Upload models as a GitHub release asset named "models.tar.gz" on a release
# tagged "models" before running this workflow. The archive should contain:
#   models/lizard-x-ray/dorsal_predictor_clahe_best.dat
#   models/lizard-x-ray/lateral_predictor_auto.dat
#   models/lizard-toe-pad/yolo_obb_6class_h7.onnx
#   models/lizard-toe-pad/toe_predictor_obb.dat
#   models/lizard-toe-pad/finger_predictor_obb.dat
#   models/lizard-toe-pad/lizard_scale.dat

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}

permissions:
  contents: write

jobs:
  validate-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test version mismatch rejection
        run: python -m unittest discover -s scripts/tests -v
      - name: Verify tag and all package versions
        run: python scripts/check-release-version.py "$RELEASE_TAG"

  build-mac:
    if: ${{ inputs.platform != 'linux' }}
    needs: validate-release
    timeout-minutes: 45
    strategy:
      matrix:
        include: ${{ fromJSON(inputs.platform == 'mac-intel'
          && '[{"arch":"x64","runner":"macos-15-intel"}]'
          || '[{"arch":"arm64","runner":"macos-15"},{"arch":"x64","runner":"macos-15-intel"}]') }}
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: ${{ matrix.arch }}

      - name: Install system dependencies
        run: brew install cmake

      - name: Download model files
        run: |
          gh release download models -p "models.tar.gz" -D /tmp
          tar xzf /tmp/models.tar.gz
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Python dependencies for PyInstaller
        run: |
          python -m pip install "cmake>=3.28,<4" setuptools wheel
          python -m pip install -r electron/requirements-build.txt
          python -m pip check
          python -c "import cv2, dlib, numpy, onnxruntime, pandas; print('Native imports OK:', numpy.__version__, onnxruntime.__version__)"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build frontend
        env:
          VITE_RELEASE_VERSION: ${{ env.RELEASE_TAG }}
        run: |
          cd frontend
          npm ci
          VITE_BASE_URL="./" npm run build

      - name: Copy frontend to Electron
        run: |
          rm -rf electron/frontend
          cp -r frontend/dist electron/frontend

      - name: Build Python backend
        run: |
          cd electron
          python -m PyInstaller pyinstaller.spec \
            --distpath "$PWD/dist" \
            --workpath "$PWD/build-temp" \
            --clean -y
        env:
          PYTHON_PATH: python

      - name: Verify frozen backend architecture
        env:
          EXPECTED_ARCH: ${{ matrix.arch == 'x64' && 'x86_64' || 'arm64' }}
        run: test "$(lipo -archs electron/dist/backend/app)" = "$EXPECTED_ARCH"

      - name: Test packaged export
        run: python scripts/smoke-desktop-export.py electron/dist/backend/app

      - name: Package Electron app
        run: |
          cd electron
          npm ci
          npx electron-builder --mac --${{ matrix.arch }} --publish never

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: dmg-${{ matrix.arch }}
          if-no-files-found: error
          path: electron/release/*-${{ matrix.arch }}.dmg

  build-win:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.platform == 'all' }}
    needs: validate-release
    timeout-minutes: 45
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download model files
        shell: bash
        run: |
          gh release download models -p "models.tar.gz" -D /tmp
          tar xzf /tmp/models.tar.gz
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Python dependencies for PyInstaller
        run: |
          python -m pip install "cmake>=3.28,<4" setuptools wheel
          python -m pip install -r electron/requirements-build.txt
          python -m pip check
          python -c "import cv2, dlib, numpy, onnxruntime, pandas; print('Native imports OK:', numpy.__version__, onnxruntime.__version__)"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build frontend
        env:
          VITE_RELEASE_VERSION: ${{ env.RELEASE_TAG }}
        run: |
          cd frontend
          npm ci
          $env:VITE_BASE_URL = "./"
          npm run build

      - name: Copy frontend to Electron
        run: |
          Remove-Item -Recurse -Force electron\frontend -ErrorAction SilentlyContinue
          Copy-Item -Recurse frontend\dist electron\frontend

      - name: Build Python backend
        run: |
          cd electron
          python -m PyInstaller pyinstaller.spec `
            --distpath "$PWD\dist" `
            --workpath "$PWD\build-temp" `
            --clean -y

      - name: Test packaged export
        run: python scripts/smoke-desktop-export.py electron/dist/backend/app.exe

      - name: Package Electron app
        run: |
          cd electron
          npm ci
          npx electron-builder --win --publish never

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: exe-win
          if-no-files-found: error
          path: electron/release/*.exe

  build-linux:
    if: ${{ inputs.platform != 'mac-intel' }}
    needs: validate-release
    timeout-minutes: 45
    # Keep the frozen app compatible with glibc on Ubuntu 22.04 and newer.
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake libx11-dev libopenblas-dev liblapack-dev

      - name: Download model files
        run: |
          gh release download models -p "models.tar.gz" -D /tmp
          tar xzf /tmp/models.tar.gz
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Python dependencies for PyInstaller
        run: |
          python -m pip install "cmake>=3.28,<4" setuptools wheel
          python -m pip install -r electron/requirements-build.txt
          python -m pip check
          python -c "import cv2, dlib, numpy, onnxruntime, pandas; print('Native imports OK:', numpy.__version__, onnxruntime.__version__)"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build frontend
        env:
          VITE_RELEASE_VERSION: ${{ env.RELEASE_TAG }}
        run: |
          cd frontend
          npm ci
          VITE_BASE_URL="./" npm run build

      - name: Copy frontend to Electron
        run: |
          rm -rf electron/frontend
          cp -r frontend/dist electron/frontend

      - name: Build Python backend
        run: |
          cd electron
          python -m PyInstaller pyinstaller.spec \
            --distpath "$PWD/dist" \
            --workpath "$PWD/build-temp" \
            --clean -y
        env:
          PYTHON_PATH: python

      - name: Test packaged export
        run: python scripts/smoke-desktop-export.py electron/dist/backend/app

      - name: Package Electron app
        run: |
          cd electron
          npm ci
          npx electron-builder --linux --publish never

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-binaries
          if-no-files-found: error
          path: |
            electron/release/*.AppImage
            electron/release/*.deb

  create-release:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.platform == 'all' }}
    needs: [build-mac, build-win, build-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: find artifacts -type f | sort

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          name: ML-Morph Web ${{ env.RELEASE_TAG }}
          draft: true
          fail_on_unmatched_files: true
          files: |
            artifacts/dmg-arm64/*-arm64.dmg
            artifacts/dmg-x64/*-x64.dmg
            artifacts/exe-win/*.exe
            artifacts/linux-binaries/*.AppImage
            artifacts/linux-binaries/*.deb
          body: |
            ## Downloads

            | Platform | File | Notes |
            |----------|------|-------|
            | macOS (Apple Silicon) | `*-arm64.dmg` | M1/M2/M3/M4 Macs |
            | macOS (Intel) | `*-x64.dmg` | 2015–2020 Intel Macs |
            | Windows | `*.exe` | Windows 10+ |
            | Linux (AppImage) | `*.AppImage` | Universal Linux (Ubuntu, Fedora, Arch, etc.) |
            | Linux (Debian/Ubuntu) | `*_amd64.deb` | Debian / Ubuntu / Mint |

            ### macOS: Which download do I need?
            - Click  → **About This Mac**
            - If you see **Apple M1/M2/M3/M4** → download the **arm64** DMG
            - If you see **Intel** → download the **x64** DMG
